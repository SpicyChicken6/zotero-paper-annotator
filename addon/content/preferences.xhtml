<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apiKey"
      data-l10n-id="pref-api-key"
      style="width: 150px"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apiKey"
      style="flex: 1"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apiBaseUrl"
      data-l10n-id="pref-api-base-url"
      style="width: 150px"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-apiBaseUrl"
      style="flex: 1"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-modelName"
      data-l10n-id="pref-model-name"
      style="width: 150px"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-modelName"
      style="flex: 1"
    ></html:input>
  </hbox>

  <html:label
    data-l10n-id="pref-openrouter-help"
    style="display: block; margin: 4px 0 8px 150px; opacity: 0.8"
  ></html:label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-maxTokenThreshold"
      data-l10n-id="pref-max-tokens"
      style="width: 150px"
    ></html:label>
    <html:input
      type="number"
      id="zotero-prefpane-__addonRef__-maxTokenThreshold"
      style="flex: 1"
    ></html:input>
  </hbox>

  <hbox align="center">
    <checkbox
      id="zotero-prefpane-__addonRef__-autoAnnotate"
      data-l10n-id="pref-auto-annotate"
    />
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
